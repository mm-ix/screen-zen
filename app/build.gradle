plugins {
    id 'com.android.application'
}

android {
    namespace 'com.screenzen.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.screenzen.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 源码里有中文注释与字符串；不显式指定的话 Windows 上会按 GBK 解
        encoding "UTF-8"
    }

    buildFeatures {
        viewBinding true
    }
}

// Only dependencies that are already present in the local Gradle cache.
// The machine's access to Maven repos is intermittent, so nothing here may
// require a download.
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'
}
